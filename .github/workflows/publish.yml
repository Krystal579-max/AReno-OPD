# PyPI Trusted Publishing via GitHub Actions
#
# When a tag matching v* is pushed, this workflow:
# 1. Builds the source distribution and wheel
# 2. Publishes to PyPI using Trusted Publishing (OIDC)
#    — no API token or password required
#
# Prerequisites (one-time setup in PyPI account settings):
#   PyPI Project: areno-opd
#   Publisher:    GitHub
#   Repository:   Krystal579-max/AReno-OPD
#   Workflow:     publish.yml
#   Environment:  (leave blank)

name: Publish to PyPI

on:
  push:
    tags:
      - "v*"   # e.g. v0.1.0, v0.2.0

jobs:
  build-and-publish:
    name: Build and publish
    runs-on: ubuntu-latest
    # Grant the job an OIDC token so the PyPI action can authenticate
    # without a long-lived API token.
    permissions:
      id-token: write   # required for Trusted Publishing
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: python -m pip install --upgrade build

      - name: Build distribution packages
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1