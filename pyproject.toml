[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "areno-opd"
version = "0.1.0"
description = "On-Policy Distillation (OPD) algorithm support for AReno framework"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
  { name = "Krystal579-max" },
]
keywords = [
  "llm",
  "knowledge-distillation",
  "on-policy-distillation",
  "opd",
  "post-training",
  "fine-tuning",
  "pytorch",
  "reinforcement-learning",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "torch>=2.0",
  "numpy",
]

[project.urls]
Homepage = "https://github.com/Krystal579-max/AReno-OPD"
Repository = "https://github.com/Krystal579-max/AReno-OPD"
Issues = "https://github.com/Krystal579-max/AReno-OPD/issues"

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "pytest-cov>=4.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["areno*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]